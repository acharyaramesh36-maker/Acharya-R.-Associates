<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;align-items:center;gap:12px;width:100%;min-width:0;height:100%">
  <a href="/" aria-label="Acharya R. &amp; Associates — home" style="display:flex;align-items:center;gap:10px;min-width:0;color:#0B2345">
    <img src="assets/ar-logo-v2.svg" alt="" width="60" height="44" style="display:block;width:60px;height:44px;flex:none;object-fit:contain">
    <span style="display:flex;flex-direction:column;gap:4px;min-width:0">
      <span style="font:600 clamp(11.5px,3.4vw,14px)/1.15 'Public Sans',sans-serif;letter-spacing:.06em;color:#0B2345" class="notranslate" translate="no">ACHARYA R. &amp; ASSOCIATES</span>
      <span style="font:400 clamp(9px,2.6vw,10.5px)/1 'Public Sans',sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#8E6A1E;white-space:nowrap">Chartered Accountants</span>
    </span>
  </a>
  <button type="button" aria-label="Menu" aria-expanded="{{ open }}" onClick="{{ toggle }}" style="margin-left:auto;flex:none;width:46px;height:46px;display:flex;align-items:center;justify-content:center;background:{{ btnBg }};border:1px solid #0B2345;border-radius:4px;cursor:pointer;padding:0">
    <sc-if value="{{ closed }}" hint-placeholder-val="{{ true }}">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0B2345" stroke-width="1.8" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"></path></svg>
    </sc-if>
    <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"></path></svg>
    </sc-if>
  </button>
</div>
<sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
  <div role="dialog" aria-label="Site menu" style="position:fixed;left:0;right:0;bottom:0;top:{{ top }};z-index:90;background:#FFFFFF;border-top:1px solid #DDE1E6;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain">
    <nav aria-label="Mobile" style="display:flex;flex-direction:column;padding:8px 20px 32px">
      <sc-for list="{{ groups }}" as="g" hint-placeholder-count="4">
        <div style="border-bottom:1px solid #EBEDF0">
          <button type="button" aria-expanded="{{ g.open }}" onClick="{{ g.toggle }}" style="width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:58px;padding:0;background:none;border:0;cursor:pointer;font:500 17px/1.2 'Public Sans',sans-serif;color:#0B2345;text-align:left">{{ g.title }}<svg aria-hidden="true" width="14" height="14" viewBox="0 0 12 12" fill="none" stroke="#0B2345" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex:none;transform:{{ g.rot }};transition:transform .3s ease"><path d="M2.5 4.5 6 8l3.5-3.5"></path></svg></button>
          <sc-if value="{{ g.open }}" hint-placeholder-val="{{ false }}">
            <ul style="list-style:none;margin:0;padding:0 0 14px;display:flex;flex-direction:column">
              <sc-for list="{{ g.items }}" as="it" hint-placeholder-count="4">
                <li><a href="{{ it.href }}" onClick="{{ close }}" style="display:flex;align-items:center;min-height:46px;padding:4px 0 4px 14px;border-left:2px solid #E6C77F;font:400 15.5px/1.35 'Public Sans',sans-serif;color:#2D5AA8">{{ it.title }}</a></li>
              </sc-for>
            </ul>
          </sc-if>
        </div>
      </sc-for>
      <a href="/contact-us" onClick="{{ close }}" style="margin-top:24px;display:flex;align-items:center;justify-content:center;gap:10px;height:52px;background:#0B2345;color:#FFFFFF;font:500 15px/1 'Public Sans',sans-serif" style-hover="background:#16345F;color:#FFFFFF">Contact Us <span aria-hidden="true" style="color:#D4B26A">→</span></a>
      <div style="margin-top:20px;display:flex;flex-direction:column;gap:10px;font:400 15px/1.4 'Public Sans',sans-serif;color:#4A5563">
        <a href="tel:+9779845819811" style="color:#0B2345">Tel: +977-9845819811</a>
        <a href="tel:+9779716393920" style="color:#0B2345">Tel: +977-9716393920</a>
      </div>
    </nav>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:84}}">
const H = '/';
const GROUPS = [
  ['Services', [['Audit and Assurance', '/audit-and-assurance'], ['Taxation and Tax Compliance', '/taxation-and-tax-compliance'], ['Accounting and Financial Reporting', '/accounting-and-financial-reporting'], ['Internal Audit and Risk Advisory', '/internal-audit-and-risk-advisory'], ['Business Advisory', '/business-advisory'], ['Due Diligence and Agreed-Upon Procedures', '/due-diligence-and-agreed-upon-procedures'], ['View all services', H + '#services']]],
  ['Industries', [['Manufacturing & Trading', '/manufacturing-and-trading'], ['Cooperatives & Microfinance', '/cooperatives-and-microfinance'], ['Hospitality & Tourism', '/hospitality-and-tourism'], ['Technology & Digital Businesses', '/technology-and-digital-businesses'], ['SMEs & Family Businesses', '/smes-and-family-businesses'], ['Healthcare & Medical', '/healthcare-and-medical'], ['Education & Institutions', '/education-and-institutions']]],
  ['About Us', [['Our firm', '/about-us'], ['Our commitments', '/our-commitments'], ['Our team', '/our-team'], ['Gallery', '/gallery'], ['Contact us', '/contact-us']]],
  ['Careers', [['Careers overview', '/careers'], ['Qualified professionals', '/qualified-professionals'], ['Articled trainees', '/articled-trainees'], ['Students & internships', '/students-and-internships'], ['Enquire about careers', '/career-enquiry']]]
];
class Component extends DCLogic {
  state = { open: false, g: null, top: 122 };
  componentWillUnmount() { document.body.style.overflow = ''; }
  setOpen(open) {
    let top = this.state.top;
    if (open) { const h = document.querySelector('header'); if (h) top = Math.round(h.getBoundingClientRect().bottom); }
    document.body.style.overflow = open ? 'hidden' : '';
    this.setState({ open, top });
  }
  renderVals() {
    const { open, g } = this.state;
    return {
      open, closed: !open, top: this.state.top + 'px', btnBg: open ? '#0B2345' : '#FFFFFF',
      toggle: () => this.setOpen(!open), close: () => this.setOpen(false),
      groups: GROUPS.map(([title, items], i) => ({ title, open: g === i, rot: g === i ? 'rotate(180deg)' : 'none',
        toggle: () => this.setState(s => ({ g: s.g === i ? null : i })),
        items: items.map(([t, href]) => ({ title: t, href })) }))
    };
  }
}
</script>
</body>
</html>
